services:
  mysql:
    image: mysql:8.4
    container_name: travel-bill-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: travel_bill_password
      MYSQL_DATABASE: travel_bill
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "24976:3306"
    volumes:
      - travel-bill-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptravel_bill_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    image: travel-bill-backend:latest
    container_name: travel-bill-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 24975
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/travel_bill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: travel_bill_password
      APP_AUTH_STATIC_TOKEN: 7f3a925e80f4c91a7b23d6e5f08a123c9b3d4e521f718293a3214b5c6d7e8f91012a3b4c5d6e7f8091a2b3c4dfd6f708192a3b4c5d6e7f8
      APP_CORS_ALLOWED_ORIGINS: "*"
      APP_WECHAT_APP_ID: appID
      APP_WECHAT_APP_SECRET: appSecret
      APP_SECURITY_RATE_LIMIT_MAX_REQUESTS_PER_MINUTE: 1000
      APP_SECURITY_IP_BLACKLIST_MAX_REQUESTS_PER_24_HOURS: 3000
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:admin}
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: admin
    ports:
      - "24975:24975"

volumes:
  travel-bill-mysql-data:
