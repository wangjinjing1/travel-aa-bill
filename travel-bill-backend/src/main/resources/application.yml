server:
  port: ${SERVER_PORT:24975}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/travel_bill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:5s}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

app:
  auth:
    token-secret: ${APP_AUTH_TOKEN_SECRET:change-this-secret-before-production}
    token-ttl-hours: ${APP_AUTH_TOKEN_TTL_HOURS:168}
    static-token: ${APP_AUTH_STATIC_TOKEN:7f3a925e80f4c91a7b23d6e5f08a123c9b3d4e521f718293a3214b5c6d7e8f91012a3b4c5d6e7f8091a2b3c4dfd6f708192a3b4c5d6e7f8}
  wechat:
    mock-login: ${APP_WECHAT_MOCK_LOGIN:false}
    app-id: ${APP_WECHAT_APP_ID:app-id}
    app-secret: ${APP_WECHAT_APP_SECRET:app-secret}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
  security:
    rate-limit:
      max-requests-per-minute: ${APP_SECURITY_RATE_LIMIT_MAX_REQUESTS_PER_MINUTE:1000}
    ip-blacklist:
      max-requests-per-24-hours: ${APP_SECURITY_IP_BLACKLIST_MAX_REQUESTS_PER_24_HOURS:3000}
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:admin}
