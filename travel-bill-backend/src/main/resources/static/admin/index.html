<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IP 黑名单管理</title>
  <style>
    :root { --bg:#f4f7fb; --card:#fff; --line:#dbe4ee; --text:#172033; --muted:#667085; --brand:#176b87; --danger:#d92d20; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:linear-gradient(180deg,#edf6fb 0%,var(--bg) 38%,#fff 100%); color:var(--text); }
    .wrap { max-width:1040px; margin:0 auto; padding:32px 20px 56px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:0 12px 36px rgba(23,32,51,0.06); padding:24px; }
    .title { margin:0 0 8px; font-size:30px; font-weight:700; }
    .sub { margin:0; color:var(--muted); line-height:1.7; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:16px; margin:24px 0 20px; flex-wrap:wrap; }
    .stats { display:flex; gap:12px; flex-wrap:wrap; }
    .chip { padding:10px 14px; border-radius:999px; background:#eef7fb; color:var(--brand); font-size:14px; font-weight:600; }
    .btn { border:none; border-radius:999px; padding:12px 20px; font-size:14px; font-weight:600; cursor:pointer; }
    .btn-primary { background:var(--brand); color:#fff; }
    .btn-ghost { background:#fff; color:var(--brand); border:1px solid var(--line); }
    .btn-danger { background:#fff4f2; color:var(--danger); border:1px solid #f5c2be; }
    .login-card { max-width:420px; margin:72px auto 0; }
    .field { margin-top:16px; }
    .field label { display:block; margin-bottom:8px; font-size:14px; font-weight:600; }
    .input { width:100%; border:1px solid var(--line); border-radius:14px; padding:12px 14px; font-size:14px; outline:none; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:16px 12px; border-top:1px solid #edf2f7; text-align:left; vertical-align:top; font-size:14px; }
    th { color:var(--muted); font-weight:600; }
    .empty { padding:40px 0; text-align:center; color:var(--muted); }
    .hidden { display:none !important; }
    .error { margin-top:12px; color:var(--danger); font-size:14px; }
    .success { margin-top:12px; color:#087443; font-size:14px; }
    @media (max-width:760px) {
      .wrap { padding:20px 14px 40px; }
      .toolbar { align-items:stretch; }
      .toolbar > * { width:100%; }
      table, thead, tbody, th, td, tr { display:block; }
      thead { display:none; }
      tr { border-top:1px solid #edf2f7; padding:12px 0; }
      td { border-top:none; padding:6px 0; }
      td::before { content:attr(data-label); display:block; color:var(--muted); font-size:12px; margin-bottom:4px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section id="loginSection" class="card login-card hidden">
      <h1 class="title">后台管理登录</h1>
      <p class="sub">用于查看和解除 IP 黑名单，不影响小程序登录流程。</p>
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" class="input" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" class="input" type="password" autocomplete="current-password" />
      </div>
      <button id="loginBtn" class="btn btn-primary" style="margin-top:20px;width:100%;">登录</button>
      <div id="loginMessage" class="error hidden"></div>
    </section>

    <section id="adminSection" class="hidden">
      <div class="card">
        <h1 class="title">IP 黑名单管理</h1>
        <p class="sub">当同一 IP 在 24 小时内访问次数超过阈值后，会自动拉入黑名单 24 小时。你可以在这里查看并手动解除。</p>
      </div>

      <div class="toolbar">
        <div class="stats">
          <div id="minuteLimit" class="chip"></div>
          <div id="dayLimit" class="chip"></div>
          <div id="blacklistCount" class="chip"></div>
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <button id="refreshBtn" class="btn btn-ghost">刷新列表</button>
          <button id="logoutBtn" class="btn btn-danger">退出登录</button>
        </div>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>IP</th>
              <th>拉黑时间</th>
              <th>到期时间</th>
              <th>触发次数</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="blacklistBody"></tbody>
        </table>
        <div id="emptyState" class="empty hidden">当前没有处于拉黑状态的 IP。</div>
        <div id="adminMessage" class="success hidden"></div>
      </div>
    </section>
  </div>

  <script>
    const loginSection = document.getElementById('loginSection');
    const adminSection = document.getElementById('adminSection');
    const loginMessage = document.getElementById('loginMessage');
    const adminMessage = document.getElementById('adminMessage');
    const blacklistBody = document.getElementById('blacklistBody');
    const emptyState = document.getElementById('emptyState');
    const minuteLimit = document.getElementById('minuteLimit');
    const dayLimit = document.getElementById('dayLimit');
    const blacklistCount = document.getElementById('blacklistCount');

    function showLogin() { loginSection.classList.remove('hidden'); adminSection.classList.add('hidden'); }
    function showAdmin() { loginSection.classList.add('hidden'); adminSection.classList.remove('hidden'); }
    function showMessage(target, text, type) { target.textContent = text; target.className = type; target.classList.remove('hidden'); }
    function hideMessage(target, type) { target.className = type; target.classList.add('hidden'); target.textContent = ''; }

    function formatDateTime(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      const pad = (v) => String(v).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    async function request(url, options = {}) {
      const response = await fetch(url, {
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options
      });
      if (response.status === 204) return null;
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.message || `请求失败: ${response.status}`);
      }
      return data;
    }

    async function loadSession() {
      const session = await request('/admin/api/session');
      minuteLimit.textContent = `每分钟限流：${session.maxRequestsPerMinute}`;
      dayLimit.textContent = `24 小时拉黑阈值：${session.maxRequestsPer24Hours}`;
      if (session.loggedIn) {
        showAdmin();
        await loadBlacklist();
      } else {
        showLogin();
      }
    }

    async function loadBlacklist() {
      hideMessage(adminMessage, 'success');
      const list = await request('/admin/api/blacklist');
      blacklistCount.textContent = `当前黑名单：${list.length}`;
      blacklistBody.innerHTML = '';
      if (!list.length) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');
      list.forEach((item) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td data-label="IP">${item.ip}</td>
          <td data-label="拉黑时间">${formatDateTime(item.blacklistedAt)}</td>
          <td data-label="到期时间">${formatDateTime(item.expiresAt)}</td>
          <td data-label="触发次数">${item.requestCount}</td>
          <td data-label="操作"><button class="btn btn-danger" data-ip="${item.ip}">解除拉黑</button></td>
        `;
        row.querySelector('button').addEventListener('click', async () => {
          const ip = item.ip;
          if (!window.confirm(`确定要解除 IP ${ip} 的黑名单吗？`)) return;
          try {
            await request(`/admin/api/blacklist/${encodeURIComponent(ip)}/remove`, { method: 'POST' });
            showMessage(adminMessage, `已解除 ${ip} 的黑名单`, 'success');
            await loadBlacklist();
          } catch (error) {
            showMessage(adminMessage, error.message, 'error');
          }
        });
        blacklistBody.appendChild(row);
      });
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      hideMessage(loginMessage, 'error');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      try {
        await request('/admin/api/login', { method: 'POST', body: JSON.stringify({ username, password }) });
        await loadSession();
      } catch (error) {
        showMessage(loginMessage, error.message, 'error');
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', loadBlacklist);
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await request('/admin/api/logout', { method: 'POST' });
      showLogin();
    });

    loadSession().catch(() => showLogin());
  </script>
</body>
</html>
