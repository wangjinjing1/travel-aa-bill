spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:classpath:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/travel_bill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:5s}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:24975}

app:
  auth:
    token-secret: ${APP_AUTH_TOKEN_SECRET:change-this-secret-before-production}
    token-ttl-hours: ${APP_AUTH_TOKEN_TTL_HOURS:168}
    password-salt: ${APP_AUTH_PASSWORD_SALT:travel-aa-bill-fixed-password-salt}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
  security:
    rate-limit:
      max-requests-per-minute: ${APP_SECURITY_RATE_LIMIT_MAX_REQUESTS_PER_MINUTE:1000}
    ip-blacklist:
      max-requests-per-24-hours: ${APP_SECURITY_IP_BLACKLIST_MAX_REQUESTS_PER_24_HOURS:3000}
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:admin}
